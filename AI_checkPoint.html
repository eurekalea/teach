<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI × 思考力｜3 題互動檢核</title>
<style>
:root{color-scheme:light;--bg:#fff;--surface:#fff;--surface2:#fff9f8;--text:#1c1c1c;--muted:#5b5656;--primary:#e45856;--accent:#e45856;--success:#247653;--danger:#b63c40;--line:#f1c4c3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:'Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;color:var(--text);min-height:100vh}
body:before{content:'';position:absolute;inset:0 0 auto 0;height:255px;pointer-events:none;opacity:.6;background-image:radial-gradient(circle at 9% 22%,transparent 13px,#f5c0bf 14px,#f5c0bf 16px,transparent 17px),radial-gradient(circle at 84% 32%,transparent 19px,#f5c0bf 20px,#f5c0bf 22px,transparent 23px),repeating-linear-gradient(120deg,transparent 0 76px,#fce4e3 77px 79px,transparent 80px 150px);mask-image:linear-gradient(#000,transparent)}
.wrap{position:relative;max-width:960px;margin:auto;padding:32px 22px 64px}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.tag{font-weight:900;letter-spacing:.06em;color:var(--primary);font-size:18px}
.mini{color:#a33e3d;border:1px solid #efc8c6;border-radius:100px;padding:8px 15px;background:#fff9f9;font-weight:700;font-size:14px}
h1{font-size:clamp(36px,5.6vw,62px);line-height:1.3;color:var(--primary);font-weight:900;margin:48px 0 16px;letter-spacing:.015em}
h1 span{color:var(--primary)}
.lead{font-size:clamp(17px,2.2vw,22px);line-height:1.75;color:#303030;max-width:800px;font-weight:500}
.progress-head{display:flex;justify-content:space-between;color:#795a59;font-size:16px;font-weight:700;margin-top:34px;margin-bottom:10px}
.track{height:10px;border-radius:20px;overflow:hidden;background:#fbe9e8}
.fill{height:100%;width:0;background:var(--primary);transition:width .25s}
.panel{border:2px solid #f0cdcc;background:white;border-radius:20px;padding:clamp(22px,4vw,44px);margin-top:24px;box-shadow:0 7px 24px #a94b4511}
.eyebrow{color:var(--primary);font-size:17px;font-weight:900;letter-spacing:.03em;margin:0 0 16px}
.question{font-size:clamp(24px,3.5vw,36px);line-height:1.48;margin:0 0 28px;color:#222;font-weight:850}
.desc{font-size:18px;color:var(--muted);line-height:1.7;margin:0 0 24px}
.options{display:grid;gap:14px}
.opt{width:100%;display:flex;gap:15px;align-items:flex-start;text-align:left;border:2px solid #efcfce;background:#fffafa;border-radius:14px;padding:19px 20px;font:inherit;font-size:clamp(17px,2vw,21px);line-height:1.65;color:#242424;cursor:pointer;transition:background .16s,border-color .16s}
.opt:hover:not(:disabled),.opt:focus-visible{border-color:var(--primary);background:#fff0ef;outline:none}
.opt:disabled{cursor:default;opacity:.95}
.opt.correct{background:#eff9f1;border-color:#4b986e}
.opt.incorrect{background:#fff1f0;border-color:#d45b57}
.letter{flex:none;width:35px;height:35px;border:2px solid #e45856;color:#d44746;background:#fff;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:17px;line-height:1}
.feedback{border-left:5px solid var(--primary);background:#fff5f4;border-radius:10px;padding:20px 23px;margin-top:25px;font-size:18px;line-height:1.75}
.feedback.good{border-color:#4b986e;background:#f2faf4}.feedback.bad{border-color:#d45b57}
.feedback strong{font-size:20px}.feedback p{margin:9px 0 0}
.actions{display:flex;justify-content:flex-end;gap:12px;margin-top:25px;flex-wrap:wrap}
.btn{font:inherit;font-size:19px;font-weight:900;background:var(--primary);border:2px solid var(--primary);border-radius:12px;color:white;padding:13px 26px;cursor:pointer}
.btn:hover:not(:disabled){background:#c94847}.btn:disabled{opacity:.38;cursor:not-allowed}.btn.secondary{background:#fff;color:var(--primary)}
.note{font-size:14px;color:#7d7070;line-height:1.7;border-top:1px solid #f2dddc;padding-top:16px;margin-top:28px}
.result{text-align:center}.score{color:var(--primary);font-size:clamp(72px,11vw,110px);font-weight:900;line-height:1.1;margin:19px 0}.score small{font-size:28px;color:#806d6c}
.result p{color:#473c3c;line-height:1.75;font-size:19px}.review{text-align:left;background:#fff5f4;border:1px solid #f1d4d2;border-radius:14px;padding:22px;font-size:18px;line-height:1.85;margin:25px 0}.review h3{color:var(--primary);margin-top:0}.review ul{padding-left:26px}.review li{margin:9px 0}
footer{font-size:13px;color:#877777;line-height:1.7;margin-top:25px}
.brandmark{display:flex;gap:4px;align-items:center;margin-right:4px}.brandmark span{width:20px;height:20px;background:#e45856;display:block}.brandmark span:nth-child(1){border-radius:0 16px 0 0}.brandmark span:nth-child(2){border-radius:50%}.brandmark span:nth-child(3){clip-path:polygon(50% 0%,100% 100%,0 100%)}
@media(max-width:600px){.wrap{padding:22px 16px 45px}.panel{padding:22px 18px}h1{margin-top:35px}.opt{padding:15px 13px}.brandmark span{width:15px;height:15px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body><main class="wrap"><div class="top"><div class="tag">AI · 認知努力與大腦運作</div><div class="mini">課堂檢核 · 3 題挑戰</div></div><h1>當 AI 幫你完成任務，<br><span>你的大腦有參與嗎？</span></h1><p class="lead">不是考你「AI 好不好」，而是看你能不能判斷：什麼時候工具幫助學習，什麼時候工具取代了思考。</p><div class="progress-head"><span id="position">第 1 題／共 3 題</span><span id="status">已完成 0／3</span></div><div class="track" role="progressbar" aria-label="答題進度" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0" id="progress"><div class="fill" id="fill"></div></div><section class="panel" id="main" aria-live="polite"></section><footer>內容依據《AI、認知努力與大腦運作》教學簡報設計。題目偏重情境遷移，而非名詞背誦。所有資料與答題結果只在此頁運作，不上傳伺服器。</footer></main>
<script>
const questions=[
{type:'概念辨識',q:'小宇要解一題數學，還沒開始思考，就直接請 AI 算出答案，照抄交作業。這件事最值得注意的是？',opts:['只要答案正確，就代表小宇已經學會了。','小宇可能跳過了必要的認知努力，不能只憑交出答案判定他理解。','只要使用 AI，就一定會讓大腦退化。'],answer:1,why:'簡報的重點是：認知努力是投入任務的心理資源。直接照抄答案，可能讓工具取代原本應由自己完成的思考；但不能因此推論「凡使用 AI 都有害」。',take:'檢核重點：能否區分「完成任務」與「真的學會」。'},
{type:'研究證據',q:'課堂介紹了一項比較 ChatGPT、搜尋引擎與不使用工具寫作的研究。下列哪個說法最謹慎、最符合簡報？',opts:['研究已經證明：所有學生使用 AI 都會永久降低智力。','研究觀察到不同寫作方式在腦部活動與記憶表現上的差異，但不能直接推論所有 AI 使用情境都會造成相同結果。','既然是 MIT 研究，不需要看研究方法與限制。'],answer:1,why:'簡報描述了三種寫作組別的比較，以及 AI 組在部分指標上的較低表現；也提醒研究仍有早期階段的限制。研究可以幫助我們提出警訊，但不能把特定任務的發現擴大成「AI 一定傷腦」。',take:'檢核重點：能否區分「研究觀察」與「過度推論」。'},
{type:'策略應用',q:'老師要你寫一篇自己的短文。以下哪一種 AI 使用流程最能兼顧學習與效率？',opts:['讓 AI 直接寫完，自己改幾個字後繳交。','先自己想觀點、寫初稿，再請 AI 提出結構或語句建議，最後由自己判斷修改並確認內容。','只要為了避免依賴 AI，就連查不懂的名詞都不可以使用工具。'],answer:1,why:'簡報的「學生 AI 使用指南」鼓勵：先自行嘗試、讓 AI 解釋或整理想法、檢查文字；不可把原創想法、理解與驗證責任全部交給 AI。',take:'檢核重點：能否提出「先思考 → 用 AI 協助 → 自己驗證」的做法。'}
];
let idx=0, selected=null, answers=[];const main=document.getElementById('main');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function update(){const n=Math.min(idx,3);document.getElementById('position').textContent=idx<3?`第 ${idx+1} 題／共 3 題`:'挑戰完成';document.getElementById('status').textContent=`已完成 ${n}／3`;document.getElementById('progress').setAttribute('aria-valuenow',n);document.getElementById('fill').style.width=`${n/3*100}%`;}
function show(){update();if(idx===3){finish();return;}selected=null;const item=questions[idx];main.innerHTML=`<p class="eyebrow">${esc(item.type)} · 第 ${idx+1} 題</p><h2 class="question">${esc(item.q)}</h2><div class="options" id="options">${item.opts.map((v,i)=>`<button type="button" class="opt" data-i="${i}"><span class="letter">${'ABC'[i]}</span><span>${esc(v)}</span></button>`).join('')}</div><div id="feedbackHolder"></div><div class="actions"><button class="btn" id="next" disabled>${idx===2?'查看結果':'下一題 →'}</button></div><p class="note">請先選一個最合理的答案，系統會立即顯示理由。選定後不可在本輪修改；完成後可重新挑戰。</p>`;main.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>choose(Number(b.dataset.i))));document.getElementById('next').addEventListener('click',()=>{idx++;show();});}
function choose(i){if(selected!==null)return;selected=i;const item=questions[idx],correct=i===item.answer;answers.push({correct,choice:i});main.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j===item.answer)b.classList.add('correct');else if(j===i)b.classList.add('incorrect');});document.getElementById('feedbackHolder').innerHTML=`<div class="feedback ${correct?'good':'bad'}" role="status"><strong>${correct?'✓ 判斷正確':'↻ 再想一層'}</strong><p>${esc(item.why)}</p><p><strong>${esc(item.take)}</strong></p></div>`;document.getElementById('next').disabled=false;}
function finish(){const total=answers.filter(a=>a.correct).length;const summary=total===3?'你能辨識 AI 使用中的思考責任，也能謹慎解讀研究證據。':total===2?'已掌握多數重點，看看哪一題混淆了「有答案」和「有學習」。':'建議重看「認知努力」、研究限制與學生 AI 使用指南，再試一次。';main.innerHTML=`<div class="result"><p class="eyebrow">挑戰結束 · 即時回饋</p><h2 class="question">這次你讓大腦做了多少事？</h2><div class="score">${total}<small> / 3 題</small></div><p>${esc(summary)}</p><div class="review"><h3>帶走三句話</h3><ul><li><strong>完成 ≠ 學會：</strong>答案交出去了，不代表思考發生了。</li><li><strong>研究 ≠ 萬用結論：</strong>先看它研究了誰、做了什麼任務，以及有哪些限制。</li><li><strong>AI 是輔助：</strong>先形成自己的想法，再借助工具，最後由自己驗證。</li></ul></div><button type="button" class="btn" id="again">重新挑戰 ↻</button></div>`;document.getElementById('again').addEventListener('click',()=>{idx=0;answers=[];show();window.scrollTo({top:0,behavior:'smooth'});});}
show();
</script></body></html>
